[project]
name = "watsonx-platform-mcp"
version = "0.1.0"
description = "MCP server for IBM watsonx Common Core Services (Projects, Assets, Connections, Jobs)"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.scripts]
watsonx-platform-mcp = "watsonx_platform_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["watsonx_platform_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
